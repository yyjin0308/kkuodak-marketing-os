<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKUODAK 로그인</title><style>body{background:#f3f6fb;color:#172238;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}.panel{background:white;padding:40px;border-radius:18px;box-shadow:0 12px 40px #10204018;width:min(360px,85vw)}input,button{width:100%;padding:14px;box-sizing:border-box;border-radius:9px;font-size:16px}input{border:1px solid #d6dce8}button{border:0;background:#2563eb;color:white;margin-top:12px;cursor:pointer}small{color:#6c7586}#err{color:#c03636}</style><div class="panel"><h2>✦ KKUODAK HQ</h2><p>꾸오닭 AI 마케팅 본부 관리자 로그인</p><form id="form"><input id="pw" type="password" placeholder="관리자 비밀번호" required autocomplete="current-password"><button>로그인</button></form><p id="err"></p><small>관리자 비밀번호는 배포 환경변수에 저장됩니다.</small></div><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok)location.href='/';else document.getElementById('err').textContent=(await r.json()).error||'로그인 실패'}</script></html>
